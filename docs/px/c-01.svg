width="5" height="499" fill="#8a8a8a"/><text x="24.00" y="54" font-size="23" fill="#7c8086" xml:space="preserve" font-family="VT,monospace"># Clone</text><text x="24.00" y="80" font-size="23" fill="#d9a441" xml:space="preserve" font-family="VT,monospace">git</text><text x="51.60" y="80" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace"> clone https://github.com/thanmaiashok/universal-optimizer.git</text><text x="24.00" y="106" font-size="23" fill="#d9a441" xml:space="preserve" font-family="VT,monospace">cd</text><text x="42.40" y="106" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace"> universal-optimizer</text><text x="24.00" y="158" font-size="23" fill="#7c8086" xml:space="preserve" font-family="VT,monospace"># Install (Python 3.9+)</text><text x="24.00" y="184" font-size="23" fill="#d9a441" xml:space="preserve" font-family="VT,monospace">pip</text><text x="51.60" y="184" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace"> install -e .</text><text x="24.00" y="236" font-size="23" fill="#7c8086" xml:space="preserve" font-family="VT,monospace"># Full install (GPU + mobile)</text><text x="24.00" y="262" font-size="23" fill="#d9a441" xml:space="preserve" font-family="VT,monospace">pip</text><text x="51.60" y="262" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace"> install -e &quot;.[full]&quot;</text><text x="24.00" y="314" font-size="23" fill="#7c8086" xml:space="preserve" font-family="VT,monospace"># Optimize a model</text><text x="24.00" y="340" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">optillm optimize gpt2 --target mobile --preset balanced</text><text x="24.00" y="392" font-size="23" fill="#7c8086" xml:space="preserve" font-family="VT,monospace"># Profile hardware constraints</text><text x="24.00" y="418" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">optillm profile ./model.pt</text><tex