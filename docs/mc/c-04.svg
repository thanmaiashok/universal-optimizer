ore/</text><text x="24.00" y="106" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|   |-- optimizer.py      </text><text x="263.20" y="106" font-size="23" fill="#7c8086" xml:space="preserve" font-family="VT,monospace"># Main orchestrator (OptiLLMOptimizer)</text><text x="24.00" y="132" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|   |-- loader.py         </text><text x="263.20" y="132" font-size="23" fill="#7c8086" xml:space="preserve" font-family="VT,monospace"># Universal model loader (HuggingFace, PyTorch, ONNX)</text><text x="24.00" y="158" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|   |-- profiler.py       </text><text x="263.20" y="158" font-size="23" fill="#7c8086" xml:space="preserve" font-family="VT,monospace"># Multi-environment hardware profiler</text><text x="24.00" y="184" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|   |-- quantizer.py      </text><text x="263.20" y="184" font-size="23" fill="#7c8086" xml:space="preserve" font-family="VT,monospace"># FP16/INT8/INT4/INT3 quantization engine</text><text x="24.00" y="210" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|   |-- pruner.py         </text><text x="263.20" y="210" font-size="23" fill="#7c8086" xml:space="preserve" font-family="VT,monospace"># Sensitivity-based adaptive pruner</text><text x="24.00" y="236" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|   |-- distiller.py      </text><text x="263.20" y="236" font-size="23" fill="#7c8086" xml:space="preserve" font-family="VT,monospace"># Knowledge distillation (teacher-student)</text><text x="24.00" y="262" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|   |-- evaluator.py      </text><text x="263.20" y="262" font-size="23" fill="#7c8086" xml:space="preserve" font-family="VT,monospace"># Reasoning score + accuracy monitor</text><text x="24.00" y="288" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|   |-- strategy.py       </text><text x="263.20" y="288" font-size="23" fill="#7c8086" xml:space="preserve" font-family="VT,monospace"># Auto pipeline selector</text><text x="24.00" y="314" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|   `-- exporter.py       </text><text x="263.20" y="314" font-size="23" fill="#7c8086" xml:space="preserve" font-family="VT,monospace"># PT / ONNX / GGUF export</text><text x="24.00" y="340" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|-- optimizers/</text><text x="24.00" y="366" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|   |-- advanced_quantizer.py</text><text x="24.00" y="392" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|   |-- gguf_exporter.py</text><text x="24.00" y="418" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|   |-- tensorrt_runtime.py</text><text x="24.00" y="444" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|   `-- thermal_manager.py</text><text x="24.00" y="470" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|-- api/main.py           </text><text x="263.20" y="470" font-size="23" fill="#7c8086" xml:space="preserve" font-family="VT,monospace"># FastAPI REST server</text><text x="24.00" y="496" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|-- cli/main.py           </text><text x="263.20" y="496" font-size="23" fill="#7c8086" xml:space="preserve" font-family="VT,monospace"># CLI entry point</text><text x="24.00" y="522" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">`-- utils/</text><text x="24.00" y="548" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">    |-- batch_processor.py</text><text